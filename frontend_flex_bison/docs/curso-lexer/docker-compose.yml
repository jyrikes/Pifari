services:
  curso-lexer:
    build:
      context: ../..
      dockerfile: docs/curso-lexer/Dockerfile
    ports:
      - "127.0.0.1:4173:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
